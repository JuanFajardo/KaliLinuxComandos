<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Controles ISO 27002</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --preventivo: #0d6efd;
            --detectivo: #fd7e14;
            --correctivo: #dc3545;
            --disuasivo: #6f42c1;
            --compensatorio: #20c997;
        }

        body {
            background: #f0f2f5;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        .hero {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff;
            padding: 2.5rem 0 2rem;
            margin-bottom: 2rem;
        }

        .hero h1 { font-weight: 700; font-size: 1.8rem; }
        .hero p  { opacity: .85; font-size: .95rem; }

        .filter-section {
            background: #fff;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 2px 12px rgba(0,0,0,.08);
            margin-bottom: 2rem;
        }

        .form-select:focus {
            border-color: #0f3460;
            box-shadow: 0 0 0 .2rem rgba(15,52,96,.25);
        }

        /* ---- Badges de tipo ---- */
        .badge-preventivo    { background: var(--preventivo) !important; }
        .badge-detectivo     { background: var(--detectivo) !important; }
        .badge-correctivo    { background: var(--correctivo) !important; }
        .badge-disuasivo     { background: var(--disuasivo) !important; }
        .badge-compensatorio { background: var(--compensatorio) !important; }

        /* ---- Tarjetas ---- */
        .card-control {
            border: none;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,.06);
            transition: transform .2s, box-shadow .2s;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .card-control:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 20px rgba(0,0,0,.12);
        }

        .card-control .card-header {
            border-radius: 10px 10px 0 0;
            font-weight: 600;
            font-size: .82rem;
            letter-spacing: .5px;
            text-transform: uppercase;
        }

        .border-left-preventivo    { border-left: 4px solid var(--preventivo) !important; }
        .border-left-detectivo     { border-left: 4px solid var(--detectivo) !important; }
        .border-left-correctivo    { border-left: 4px solid var(--correctivo) !important; }
        .border-left-disuasivo     { border-left: 4px solid var(--disuasivo) !important; }
        .border-left-compensatorio { border-left: 4px solid var(--compensatorio) !important; }

        .header-preventivo    { background: var(--preventivo); color: #fff; }
        .header-detectivo     { background: var(--detectivo); color: #fff; }
        .header-correctivo    { background: var(--correctivo); color: #fff; }
        .header-disuasivo     { background: var(--disuasivo); color: #fff; }
        .header-compensatorio { background: var(--compensatorio); color: #fff; }

        .control-id   { font-weight: 700; color: #1a1a2e; font-size: 1rem; }
        .control-name { font-weight: 600; color: #333; font-size: .92rem; }

        .area-badge {
            font-size: .72rem;
            padding: .3em .6em;
            border-radius: 20px;
            cursor: pointer;
            transition: transform .15s, box-shadow .15s;
            position: relative;
        }

        .area-badge:hover {
            transform: scale(1.1);
            box-shadow: 0 2px 8px rgba(0,0,0,.18);
            z-index: 2;
        }

        .area-administrativo { background: #e3f2fd; color: #1565c0; }
        .area-tecnico        { background: #fff3e0; color: #e65100; }
        .area-fisico         { background: #e8f5e9; color: #2e7d32; }

        /* ---- Tooltip de ejemplo al fondo de la tarjeta ---- */
        .ejemplo-panel {
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
            padding: .6rem .85rem;
            font-size: .78rem;
            color: #444;
            line-height: 1.35;
            min-height: 0;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height .35s ease, opacity .25s ease, padding .3s ease;
        }

        .ejemplo-panel.show {
            max-height: 200px;
            opacity: 1;
            padding: .7rem .85rem;
        }

        .ejemplo-panel .ej-label {
            font-weight: 700;
            color: #1a1a2e;
            font-size: .7rem;
            text-transform: uppercase;
            letter-spacing: .4px;
            display: block;
            margin-bottom: .2rem;
        }

        .ejemplo-panel .ej-icon {
            margin-right: .3rem;
            opacity: .7;
        }

        /* ---- Grupo headers ---- */
        .group-header {
            font-weight: 700;
            font-size: 1.25rem;
            padding: .75rem 1rem;
            border-radius: 8px;
            margin: 1.5rem 0 1rem;
            color: #fff;
        }

        /* ---- Stats ---- */
        .stats-card {
            border: none;
            border-radius: 10px;
            text-align: center;
            padding: 1rem;
            color: #fff;
            font-weight: 600;
        }

        .stats-number { font-size: 2rem; font-weight: 800; }
        #results-count { font-weight: 600; color: #555; }

        .no-results { text-align: center; padding: 3rem; color: #888; }
        .no-results i { font-size: 3rem; margin-bottom: 1rem; display: block; }

        /* ---- Panel descriptivo (reemplaza leyenda) ---- */
        .desc-panel {
            margin-top: 1.25rem;
            border-radius: 10px;
            overflow: hidden;
            transition: all .3s ease;
        }

        .desc-card {
            border: none;
            border-radius: 10px;
            margin-bottom: .75rem;
            box-shadow: 0 1px 6px rgba(0,0,0,.06);
            overflow: hidden;
        }

        .desc-card .desc-header {
            padding: .6rem 1rem;
            font-weight: 700;
            font-size: .82rem;
            letter-spacing: .4px;
            text-transform: uppercase;
            color: #fff;
            display: flex;
            align-items: center;
            gap: .5rem;
        }

        .desc-card .desc-body {
            padding: .75rem 1rem;
            font-size: .85rem;
            color: #444;
            background: #fff;
            line-height: 1.5;
        }

        .desc-card .desc-body strong {
            color: #1a1a2e;
        }

        .desc-combo {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #fff;
            border-radius: 10px;
            padding: 1rem 1.25rem;
            font-size: .88rem;
            line-height: 1.5;
            box-shadow: 0 2px 10px rgba(0,0,0,.12);
        }

        .desc-combo .combo-title {
            font-weight: 700;
            font-size: .78rem;
            text-transform: uppercase;
            letter-spacing: .5px;
            opacity: .8;
            margin-bottom: .35rem;
        }

        /* ---- Animaciones ---- */
        .fade-in { animation: fadeIn .4s ease-in; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .btn-clear {
            border: 1px solid #dee2e6;
            background: #fff;
            color: #666;
            transition: all .2s;
        }
        .btn-clear:hover {
            background: #f8f9fa;
            color: #333;
            border-color: #adb5bd;
        }

        @media (max-width: 576px) {
            .hero h1 { font-size: 1.3rem; }
            .stats-number { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

<!-- Hero -->
<section class="hero">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-auto">
                <i class="fas fa-shield-halved fa-2x opacity-75"></i>
            </div>
            <div class="col">
                <h1 class="mb-1">Controles ISO 27002:2022</h1>
                <p class="mb-0">Visualizador interactivo &mdash; Anexo A &middot; NCh-ISO/IEC 27001:2023</p>
            </div>
        </div>
    </div>
</section>

<div class="container pb-5">

    <!-- Stats -->
    <div class="row g-3 mb-4" id="stats-row">
        <div class="col-6 col-md">
            <div class="stats-card" style="background:var(--preventivo)">
                <div class="stats-number" id="stat-preventivo">0</div>
                <small>Preventivos</small>
            </div>
        </div>
        <div class="col-6 col-md">
            <div class="stats-card" style="background:var(--detectivo)">
                <div class="stats-number" id="stat-detectivo">0</div>
                <small>Detectivos</small>
            </div>
        </div>
        <div class="col-6 col-md">
            <div class="stats-card" style="background:var(--correctivo)">
                <div class="stats-number" id="stat-correctivo">0</div>
                <small>Correctivos</small>
            </div>
        </div>
        <div class="col-6 col-md">
            <div class="stats-card" style="background:var(--disuasivo)">
                <div class="stats-number" id="stat-disuasivo">0</div>
                <small>Disuasivos</small>
            </div>
        </div>
        <div class="col-6 col-md mx-auto">
            <div class="stats-card" style="background:var(--compensatorio)">
                <div class="stats-number" id="stat-compensatorio">0</div>
                <small>Compensatorios</small>
            </div>
        </div>
    </div>

    <!-- Filtros -->
    <div class="filter-section">
        <div class="row g-3 align-items-end">
            <div class="col-12 col-md-5">
                <label for="filterTipo" class="form-label fw-semibold">
                    <i class="fas fa-filter me-1"></i> Tipo de Control
                </label>
                <select id="filterTipo" class="form-select">
                    <option value="">-- Todos los tipos --</option>
                    <option value="Preventivo">Preventivo</option>
                    <option value="Detectivo">Detectivo</option>
                    <option value="Correctivo">Correctivo</option>
                    <option value="Disuasivo">Disuasivo</option>
                    <option value="Compensatorio">Compensatorio</option>
                </select>
            </div>
            <div class="col-12 col-md-5">
                <label for="filterArea" class="form-label fw-semibold">
                    <i class="fas fa-layer-group me-1"></i> Area
                </label>
                <select id="filterArea" class="form-select">
                    <option value="">-- Todas las areas --</option>
                    <option value="Administrativo">Administrativos</option>
                    <option value="Tecnico">Tecnicos</option>
                    <option value="Fisico">Fisicos</option>
                </select>
            </div>
            <div class="col-12 col-md-2 d-grid">
                <button id="btnClear" class="btn btn-clear">
                    <i class="fas fa-rotate-left me-1"></i> Limpiar
                </button>
            </div>
        </div>

        <!-- Panel descriptivo dinamico (reemplaza la leyenda) -->
        <div id="desc-panel" class="desc-panel"></div>
    </div>

    <!-- Resultados -->
    <div id="results-count" class="mb-3"></div>
    <div id="results"></div>

</div>

<footer class="bg-dark text-white text-center py-3 mt-auto">
    <small>Basado en NCh-ISO/IEC 27001:2023 &mdash; Anexo A &middot; ISO/IEC 27002:2022</small>
</footer>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
$(function () {

    /* =============================================================
       DESCRIPCIONES DE TIPOS DE CONTROL
       ============================================================= */
    var tipoDescripciones = {
        Preventivo:    "Controles disenados para evitar que un incidente de seguridad se materialice. Actuan antes de que la amenaza impacte, estableciendo barreras y restricciones que reducen la probabilidad de ocurrencia de un evento adverso.",
        Detectivo:     "Controles que identifican y alertan sobre actividades no autorizadas, anomalias o incidentes de seguridad durante o despues de su ocurrencia. Permiten una respuesta oportuna al hacer visible lo que de otro modo pasaria desapercibido.",
        Correctivo:    "Controles que mitigan el impacto de un incidente ya ocurrido y restauran los sistemas, procesos o servicios a su estado normal de operacion. Se activan despues del evento para limitar el dano y acelerar la recuperacion.",
        Disuasivo:     "Controles que desalientan a potenciales atacantes o infractores de intentar acciones maliciosas. Funcionan como advertencia visible de que existen consecuencias, reduciendo la motivacion para cometer una violacion de seguridad.",
        Compensatorio: "Controles alternativos que proporcionan un nivel de proteccion equivalente cuando el control primario no puede implementarse. Suplen limitaciones tecnicas, presupuestarias u operativas sin comprometer el nivel de seguridad requerido."
    };

    /* =============================================================
       DESCRIPCIONES DE AREAS
       ============================================================= */
    var areaDescripciones = {
        Administrativo: "Politicas, procedimientos, normas y directrices que regulan la gestion organizacional de la seguridad. Incluyen la gobernanza, la gestion de riesgos, la formacion del personal y el cumplimiento normativo.",
        Tecnico:        "Mecanismos tecnologicos implementados en hardware, software y redes para proteger los sistemas de informacion. Abarcan desde cifrado y autenticacion hasta monitoreo automatizado y control de acceso logico.",
        Fisico:         "Medidas tangibles de proteccion del entorno, las instalaciones, los equipos y la infraestructura. Incluyen barreras perimetrales, control de acceso fisico, vigilancia, climatizacion y proteccion ambiental."
    };

    /* =============================================================
       DESCRIPCIONES DE COMBINACION TIPO + AREA
       ============================================================= */
    var comboDescripciones = {
        "Preventivo|Administrativo":    "Establece politicas, normas y procedimientos organizacionales que bloquean amenazas antes de que se concreten. Ataca la falta de gobernanza, la ausencia de directrices claras y el desconocimiento del personal como vectores de riesgo.",
        "Preventivo|Tecnico":           "Implementa barreras tecnologicas (firewalls, cifrado, ACLs, antimalware) que impiden el acceso no autorizado y bloquean ataques antes de que comprometan los sistemas. Ataca vulnerabilidades de software, configuraciones debiles y exposicion de datos.",
        "Preventivo|Fisico":            "Instala barreras fisicas, cerraduras, controles biometricos y zonificacion que impiden el acceso no autorizado a instalaciones criticas. Ataca la intrusion fisica, el robo de equipos y la manipulacion de infraestructura.",
        "Detectivo|Administrativo":     "Define procesos de auditoria, revision periodica y evaluacion que identifican irregularidades en la gestion. Ataca el incumplimiento de politicas, el fraude interno y las desviaciones en los procedimientos establecidos.",
        "Detectivo|Tecnico":            "Despliega sistemas de monitoreo (SIEM, IDS/IPS, analisis de logs) que detectan comportamientos anomalos en tiempo real. Ataca intrusiones activas, malware en ejecucion, fugas de datos y movimiento lateral de atacantes.",
        "Detectivo|Fisico":             "Utiliza camaras CCTV, sensores de movimiento y sistemas de alarma que identifican accesos fisicos no autorizados. Ataca la infiltracion en areas restringidas, el sabotaje y la vigilancia hostil.",
        "Correctivo|Administrativo":    "Establece planes de respuesta a incidentes, procedimientos de escalamiento y protocolos de recuperacion organizacional. Ataca la desorganizacion post-incidente, la perdida de continuidad operativa y la repeticion de errores.",
        "Correctivo|Tecnico":           "Activa mecanismos de respaldo, restauracion automatizada y parches de emergencia que recuperan sistemas comprometidos. Ataca la perdida de datos, la indisponibilidad de servicios y la persistencia de vulnerabilidades explotadas.",
        "Correctivo|Fisico":            "Ejecuta procedimientos de reparacion, reemplazo de equipos danados y restauracion de infraestructura fisica. Ataca los efectos de desastres naturales, fallas electricas y danos fisicos a los activos.",
        "Disuasivo|Administrativo":     "Comunica consecuencias disciplinarias, legales y contractuales para desalentar conductas indebidas. Ataca la negligencia interna, el abuso de privilegios y la tentacion de violar las politicas de seguridad.",
        "Disuasivo|Tecnico":            "Implementa banners de advertencia, registros de auditoria visibles y marcas de agua digitales que disuaden la manipulacion. Ataca el acceso furtivo, la exfiltracion oportunista y el uso indebido de sistemas.",
        "Disuasivo|Fisico":             "Instala senalizacion de seguridad, camaras visibles, iluminacion perimetral y guardias que desalientan tentativas de intrusion. Ataca el vandalismo, el robo y los intentos de acceso no autorizado a instalaciones.",
        "Compensatorio|Administrativo": "Establece procedimientos alternativos, controles manuales y supervisiones reforzadas cuando los controles primarios de gestion no son viables. Ataca las brechas de cobertura cuando restricciones legales, presupuestarias u organizativas impiden la solucion ideal.",
        "Compensatorio|Tecnico":        "Implementa soluciones tecnologicas de respaldo como redundancia, replicacion y failover que suplen las limitaciones del control principal. Ataca la indisponibilidad, el punto unico de falla y la insuficiencia de recursos tecnologicos.",
        "Compensatorio|Fisico":         "Aplica medidas fisicas sustitutivas como vigilancia adicional, escoltas o rutas alternas cuando las protecciones principales no pueden instalarse. Ataca la exposicion por limitaciones de infraestructura o ubicacion."
    };

    /* =============================================================
       ICONOS
       ============================================================= */
    var tipoIconos = {
        Preventivo:    "fa-shield-halved",
        Detectivo:     "fa-magnifying-glass",
        Correctivo:    "fa-wrench",
        Disuasivo:     "fa-hand",
        Compensatorio: "fa-scale-balanced"
    };

    var areaIconos = {
        Administrativo: "fa-briefcase",
        Tecnico:        "fa-microchip",
        Fisico:         "fa-building-shield"
    };

    var tiposOrden = ["Preventivo","Detectivo","Correctivo","Disuasivo","Compensatorio"];

    /* =============================================================
       BASE DE DATOS DE CONTROLES  (Anexo A - ISO/IEC 27001:2023)
       Cada control: id, nombre, tipos[], areas[], ejemplos:{}
       ============================================================= */
    var controles = [
        // ===== 5  CONTROLES ORGANIZACIONALES =====
        { id:"5.1",  nombre:"Politicas para la seguridad de la informacion",
          tipos:["Preventivo"], areas:["Administrativo"],
          ejemplos:{ Administrativo:"Redactar y aprobar una politica corporativa de seguridad de la informacion con revision anual obligatoria." }},
        { id:"5.2",  nombre:"Funciones y responsabilidades de seguridad de la informacion",
          tipos:["Preventivo"], areas:["Administrativo"],
          ejemplos:{ Administrativo:"Designar formalmente un CISO y definir responsabilidades de seguridad para cada jefatura de area." }},
        { id:"5.3",  nombre:"Segregacion de funciones",
          tipos:["Preventivo"], areas:["Administrativo"],
          ejemplos:{ Administrativo:"Separar las funciones de quien aprueba pagos de quien los ejecuta para evitar fraude interno." }},
        { id:"5.4",  nombre:"Responsabilidades de la direccion",

        { id:"5.5",  nombre:"Contacto con autoridades",
          tipos:["Preventivo","Correctivo"], areas:["Administrativo"],
          ejemplos:{ Administrativo:"Mantener un directorio actualizado de contactos en CSIRT, policia cibernetica y reguladores para reportar incidentes." }},
        { id:"5.6",  nombre:"Contacto con grupos de interes especiales",
          tipos:["Preventivo","Correctivo"], areas:["Administrativo"],

        { id:"5.7",  nombre:"Inteligencia de amenazas",

        { id:"5.8",  nombre:"Seguridad de la informacion en la gestion de proyectos",
          tipos:["Preventivo"], areas:["Administrativo"],
          ejemplos:{ Administrativo:"Incluir un checklist de requisitos de seguridad en la metodologia de gestion de proyectos de la organizacion." }},
        { id:"5.9",  nombre:"Inventario de informacion y otros activos asociados",
          tipos:["Preventivo"], areas:["Administrativo"],
          ejemplos:{ Administrativo:"Mantener una CMDB actualizada con todos los activos de informacion, sus propietarios y su clasificacion." }},
        { id:"5.10", nombre:"Uso aceptable de la informacion y otros activos asociados",
          tipos:["Preventivo"], areas:["Administrativo"],
          ejemplos:{ Administrativo:"Publicar una politica de uso aceptable que prohiba almacenar datos corporativos en cuentas personales de nube." }},
        { id:"5.11", nombre:"Retorno de activos",
          tipos:["Preventivo"], areas:["Administrativo"],
          ejemplos:{ Administrativo:"Implementar un checklist de offboarding que verifique la devolucion de laptop, tarjetas y tokens antes de la desvinculacion." }},
        { id:"5.12", nombre:"Clasificacion de la informacion",
          tipos:["Preventivo"], areas:["Administrativo"],
          ejemplos:{ Administrativo:"Definir niveles de clasificacion (Publica, Interna, Confidencial, Secreta) con criterios claros para cada categoria." }},
        { id:"5.13", nombre:"Etiquetado de la informacion",
          tipos:["Preventivo"], areas:["Administrativo"],

        { id:"5.14", nombre:"Transferencia de informacion",

          ejemplos:{ Administrativo:"Establecer acuerdos de intercambio de informacion con terceros que definan canales y protocolos autorizados.", Tecnico:"Configurar SFTP con cifrado TLS para todas las transferencias de archivos con proveedores externos." }},
        { id:"5.15", nombre:"Control de acceso",

        { id:"5.16", nombre:"Gestion de identidad",
          tipos:["Preventivo"], areas:["Administrativo","Tecnico"],
          ejemplos:{ Administrativo:"Definir un procedimiento formal de alta, baja y modificacion de cuentas de usuario con aprobacion del jefe directo.", Tecnico:"Implementar un sistema IAM centralizado que gestione el ciclo de vida completo de las identidades digitales." }},
        { id:"5.17", nombre:"Informacion de autenticacion",

    /* =============================================================
       RENDER DEL PANEL DESCRIPTIVO
       ============================================================= */
    function renderDescPanel() {
        var tipo = $("#filterTipo").val();
        var area = $("#filterArea").val();
        var html = "";

        // --- Ambos seleccionados: mostrar tipo + area + combo ---
        if (tipo && area) {
            html += buildDescCard(tipo, tipoDescripciones[tipo], tipoIconos[tipo], "header-" + tipo.toLowerCase());
            html += buildDescCardArea(area, areaDescripciones[area], areaIconos[area]);
            var comboKey = tipo + "|" + area;
            if (comboDescripciones[comboKey]) {
                html += '<div class="desc-combo fade-in mt-2">' +
                    '<div class="combo-title"><i class="fas fa-bolt me-1"></i> Que ataca esta combinacion</div>' +
                    comboDescripciones[comboKey] +
                '</div>';
            }
        }
        // --- Solo tipo ---
        else if (tipo && !area) {
            html += buildDescCard(tipo, tipoDescripciones[tipo], tipoIconos[tipo], "header-" + tipo.toLowerCase());
        }
        // --- Solo area ---
        else if (!tipo && area) {
            html += buildDescCardArea(area, areaDescripciones[area], areaIconos[area]);
        }
        // --- Ninguno: mostrar resumen compacto de todos ---
        else {
            html += '<div class="row g-2 mt-1 fade-in">';
            tiposOrden.forEach(function(t) {
                html += '<div class="col-12 col-md-6 col-xl">' +
                    '<div class="desc-card mb-0" style="height:100%">' +
                        '<div class="desc-header header-' + t.toLowerCase() + '">' +
                            '<i class="fas ' + tipoIconos[t] + '"></i> ' + t +
                        '</div>' +
                        '<div class="desc-body" style="font-size:.78rem">' + tipoDescripciones[t].substring(0, 120) + '&hellip;</div>' +
                    '</div>' +
                '</div>';
            });
            html += '</div>';
            html += '<div class="row g-2 mt-2 fade-in">';
            ["Administrativo","Tecnico","Fisico"].forEach(function(a) {
                var colors = { Administrativo:"#1565c0", Tecnico:"#e65100", Fisico:"#2e7d32" };
                var bgs = { Administrativo:"#e3f2fd", Tecnico:"#fff3e0", Fisico:"#e8f5e9" };
                html += '<div class="col-12 col-md-4">' +
                    '<div class="desc-card mb-0" style="height:100%">' +
                        '<div class="desc-header" style="background:' + colors[a] + '">' +
                            '<i class="fas ' + areaIconos[a] + '"></i> ' + a +
                        '</div>' +
                        '<div class="desc-body" style="font-size:.78rem;background:' + bgs[a] + '">' + areaDescripciones[a].substring(0, 110) + '&hellip;</div>' +
                    '</div>' +
                '</div>';
            });
            html += '</div>';
        }

        $("#desc-panel").html(html);
    }

    function buildDescCard(tipo, desc, icon, headerClass) {
        return '<div class="desc-card fade-in">' +
            '<div class="desc-header ' + headerClass + '">' +
                '<i class="fas ' + icon + '"></i> Tipo de Control: ' + tipo +
            '</div>' +
            '<div class="desc-body">' + desc + '</div>' +
        '</div>';
    }

    function buildDescCardArea(area, desc, icon) {
        var colors = { Administrativo:"#1565c0", Tecnico:"#e65100", Fisico:"#2e7d32" };
        var bgs = { Administrativo:"#e3f2fd", Tecnico:"#fff3e0", Fisico:"#e8f5e9" };
        return '<div class="desc-card fade-in">' +
            '<div class="desc-header" style="background:' + colors[area] + '">' +
                '<i class="fas ' + icon + '"></i> Area: ' + area +
            '</div>' +
            '<div class="desc-body" style="background:' + bgs[area] + '">' + desc + '</div>' +
        '</div>';
    }

    /* =============================================================
       BUILD CARD CON TOOLTIP DE EJEMPLO
       ============================================================= */
    function buildCard(ctrl, tipo) {
        var tipoKey = tipo.toLowerCase();

        var areasHtml = ctrl.areas.map(function(a) {
            var ej = (ctrl.ejemplos && ctrl.ejemplos[a]) ? ctrl.ejemplos[a] : "";
            return '<span class="badge area-badge area-' + a.toLowerCase() + '" ' +
                'data-ejemplo="' + escapeAttr(ej) + '" ' +
                'data-area="' + a + '">' +
                '<i class="fas ' + areaIconos[a] + ' me-1"></i>' + a +
            '</span>';
        }).join(' ');

        var tiposHtml = ctrl.tipos.map(function(t) {
            return '<span class="badge badge-' + t.toLowerCase() + '">' + t + '</span>';
        }).join(' ');

        return '<div class="col-12 col-sm-6 col-lg-4 col-xl-3 mb-3 fade-in">' +
            '<div class="card card-control border-left-' + tipoKey + '">' +
                '<div class="card-header header-' + tipoKey + '">' +
                    '<i class="fas ' + tipoIconos[tipo] + ' me-1"></i> ' + tipo +
                '</div>' +
                '<div class="card-body">' +
                    '<div class="control-id mb-1">' + ctrl.id + '</div>' +
                    '<div class="control-name mb-2">' + ctrl.nombre + '</div>' +
                    '<div class="mb-2">' + tiposHtml + '</div>' +
                    '<div>' + areasHtml + '</div>' +
                '</div>' +
                '<div class="ejemplo-panel"></div>' +
            '</div>' +
        '</div>';
    }

    function escapeAttr(str) {
        return str.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    /* =============================================================
       HOVER EN BADGES: Mostrar ejemplo en panel inferior de la tarjeta
       ============================================================= */
    $(document).on("mouseenter", ".area-badge", function() {
        var $badge = $(this);
        var ejemplo = $badge.attr("data-ejemplo");
        var area = $badge.attr("data-area");
        if (!ejemplo) return;

        var areaColors = { Administrativo:"#1565c0", Tecnico:"#e65100", Fisico:"#2e7d32" };
        var $panel = $badge.closest(".card-control").find(".ejemplo-panel");

        $panel.html(
            '<span class="ej-label" style="color:' + areaColors[area] + '">' +
                '<i class="fas ' + areaIconos[area] + ' ej-icon"></i>Ejemplo ' + area +
            '</span>' + ejemplo
        ).addClass("show");
    });

    $(document).on("mouseleave", ".area-badge", function() {
        $(this).closest(".card-control").find(".ejemplo-panel").removeClass("show");
    });

    /* =============================================================
       RENDER PRINCIPAL
       ============================================================= */
    function render() {
        var tipoFilter = $("#filterTipo").val();
        var areaFilter = $("#filterArea").val();
        var $results   = $("#results");
        var html       = "";
        var totalShown = 0;
        var counts     = { Preventivo:0, Detectivo:0, Correctivo:0, Disuasivo:0, Compensatorio:0 };

        if (tipoFilter && !areaFilter) {
            controles.forEach(function(c) {
                if (c.tipos.indexOf(tipoFilter) !== -1) {
                    html += buildCard(c, tipoFilter);
                    totalShown++;
                    counts[tipoFilter]++;
                }
            });
        }
        else if (!tipoFilter && areaFilter) {
            tiposOrden.forEach(function(tipo) {
                var cards = "";
                var groupCount = 0;
                controles.forEach(function(c) {
                    if (c.areas.indexOf(areaFilter) !== -1 && c.tipos.indexOf(tipo) !== -1) {
                        cards += buildCard(c, tipo);
                        groupCount++;
                        totalShown++;
                        counts[tipo]++;
                    }
                });
                if (groupCount > 0) {
                    html += '<div class="group-header header-' + tipo.toLowerCase() + '">' +
                        '<i class="fas ' + tipoIconos[tipo] + ' me-2"></i>' +
                        tipo + 's (' + groupCount + ')' +
                    '</div>';
                    html += '<div class="row">' + cards + '</div>';
                }
            });
        }
        else if (tipoFilter && areaFilter) {
            controles.forEach(function(c) {
                if (c.tipos.indexOf(tipoFilter) !== -1 && c.areas.indexOf(areaFilter) !== -1) {
                    html += buildCard(c, tipoFilter);
                    totalShown++;
                    counts[tipoFilter]++;
                }
            });
        }
        else {
            tiposOrden.forEach(function(tipo) {
                var cards = "";
                var groupCount = 0;
                controles.forEach(function(c) {
                    if (c.tipos.indexOf(tipo) !== -1) {
                        cards += buildCard(c, tipo);
                        groupCount++;
                        totalShown++;
                        counts[tipo]++;
                    }
                });
                if (groupCount > 0) {
                    html += '<div class="group-header header-' + tipo.toLowerCase() + '">' +
                        '<i class="fas ' + tipoIconos[tipo] + ' me-2"></i>' +
                        tipo + 's (' + groupCount + ')' +
                    '</div>';
                    html += '<div class="row">' + cards + '</div>';
                }
            });
        }

        if ((tipoFilter && !areaFilter) || (tipoFilter && areaFilter)) {
            html = '<div class="row">' + html + '</div>';
        }

        if (totalShown === 0) {
            html = '<div class="no-results"><i class="fas fa-inbox"></i><h5>Sin resultados</h5>' +
                   '<p class="text-muted">No se encontraron controles para la combinacion seleccionada.</p></div>';
        }

        $results.html(html);
        $("#results-count").html(
            '<i class="fas fa-list me-1"></i> Mostrando <strong>' + totalShown + '</strong> controles'
        );

        $("#stat-preventivo").text(counts.Preventivo);
        $("#stat-detectivo").text(counts.Detectivo);
        $("#stat-correctivo").text(counts.Correctivo);
        $("#stat-disuasivo").text(counts.Disuasivo);
        $("#stat-compensatorio").text(counts.Compensatorio);

        renderDescPanel();
    }

    // Eventos
    $("#filterTipo, #filterArea").on("change", render);

    $("#btnClear").on("click", function () {
        $("#filterTipo").val("");
        $("#filterArea").val("");
        render();
    });

    // Render inicial
    render();
});
</script>
</body>
</html>
